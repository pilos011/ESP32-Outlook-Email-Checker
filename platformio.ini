; Outlook Mail LED — ESP32-S3-N16R8  (16 MB Flash / 8 MB Octal PSRAM)
; 빌드 전에 scripts/gen_config.py 가 config.ini → src/config_generated.h 변환
[env:esp32-s3-devkitc-1]
platform = espressif32@^6.6.0
board = esp32-s3-devkitc-1
framework = arduino

; ── 플래시 / PSRAM ───────────────────────────────────────────────────────────
; N16R8: QIO NOR Flash 16 MB  +  OPI Octal PSRAM 8 MB
board_build.arduino.memory_type = qio_opi   ; QIO Flash + OPI PSRAM (dio_opi 보다 빠름)
board_build.flash_mode          = qio
board_upload.flash_size         = 16MB
board_build.f_flash             = 80000000L ; 80 MHz 플래시

; ── 파티션 테이블 (16 MB 전용) ────────────────────────────────────────────────
board_build.partitions = partitions_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM

; 빌드 직전에 config.ini → config_generated.h 변환
extra_scripts = pre:scripts/gen_config.py

lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  adafruit/Adafruit NeoPixel@^1.12.0
  olikraus/U8g2@^2.35
